[project]
name = "crucible"
version = "0.1.0"
description = "Autonomous multi-agent QA platform: agents that recon, plan, execute, and triage tests against an app under test."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Wave 1 — the foundation. Everything here is required for the core pipeline to
# import and run. Deliberately small so a failure to resolve isolates itself.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "openai>=1.40",
    "tenacity>=8.5",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Wave 2 — browser + API execution fabric.
browser = [
    "playwright>=1.47",
]

# Wave 3 — our own control-plane API.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# Wave 4 — agent frameworks. Installed last because these are the largest and
# most likely to lag on a brand-new CPython.
agents = [
    "autogen-agentchat>=0.4",
    "autogen-core>=0.4",
    "autogen-ext[openai]>=0.4",
    "langgraph>=0.2",
]

# Wave 5 — source-code intelligence for white-box triage.
codeintel = [
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.4",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
crucible = "crucible.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["crucible"]
mypy_path = "src"
