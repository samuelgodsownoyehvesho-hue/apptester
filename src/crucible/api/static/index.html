<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crucible — live run</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e222d;
    --line: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6aa9ff;
    --ok: #4ec9a0;
    --warn: #e2b341;
    --bad: #f0736a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); animation: pulse 1.4s infinite; }
  .dot.done { background: var(--accent); }
  .dot.fail { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  form { display: flex; gap: 10px; padding: 18px 22px 0; flex-wrap: wrap; }
  input[type=url] {
    flex: 1 1 340px; padding: 11px 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-family: var(--mono); font-size: 13px;
  }
  input[type=url]:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 11px 20px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #0b1020; font-weight: 600; font-size: 14px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main {
    display: grid; grid-template-columns: minmax(0,1.35fr) minmax(320px,1fr);
    gap: 18px; padding: 18px 22px 40px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  section > h2 {
    margin: 0; padding: 12px 15px; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; justify-content: space-between; align-items: center;
  }
  #feed {
    height: 58vh; overflow-y: auto; padding: 10px 14px;
    font-family: var(--mono); font-size: 12.5px;
  }
  .row { display: flex; gap: 9px; padding: 3px 0; align-items: baseline; }
  .row .t { color: #59607a; flex: 0 0 58px; }
  .row .m { min-width: 0; word-break: break-word; }
  .k-stage  { color: var(--accent); font-weight: 600; }
  .k-page   { color: #9d8bd6; }
  .k-check  { color: #d6c68b; }
  .k-bad    { color: var(--bad); }
  .k-good   { color: var(--ok); }
  .k-mute   { color: var(--muted); }
  .row.err .m { color: var(--bad); }

  .pad { padding: 14px 15px; }
  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; font-family: var(--mono); }
  .empty { color: var(--muted); font-size: 13px; }

  .finding { padding: 12px 15px; border-top: 1px solid var(--line); }
  .finding:first-of-type { border-top: 0; }
  .finding .title { font-size: 14px; line-height: 1.45; }
  .finding .meta { color: var(--muted); font-size: 11.5px; font-family: var(--mono); margin-top: 4px; }
  .finding .blk { margin-top: 9px; font-size: 12.5px; line-height: 1.5; color: #c3c9d6; }
  .finding .lbl {
    display: block; color: var(--muted); font-size: 10px; letter-spacing: .09em;
    text-transform: uppercase; margin-bottom: 2px;
  }
  .finding .fix { color: #8fd9bc; }
  .finding .fix .lbl { color: #4d9e83; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-family: var(--mono); border: 1px solid var(--line); color: var(--muted);
  }
  .badge.high { color: var(--bad); border-color: #6d3835; }
  .badge.medium { color: var(--warn); border-color: #6b5726; }
  .score { font-size: 26px; font-family: var(--mono); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .cite { padding: 9px 0; border-top: 1px dashed var(--line); font-size: 12.5px; }
  .cite:first-of-type { border-top: 0; }
  .cite .sig { color: var(--accent); font-family: var(--mono); font-size: 11.5px; }
  .cite .det { color: var(--text); }

  #chatSection {
    margin: 0 22px 40px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  #chatSection > h2 {
    margin: 0; padding: 12px 15px; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  #chatMessages {
    height: 260px; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .chat-msg {
    max-width: 80%; padding: 10px 14px; border-radius: 10px;
    font-size: 13.5px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.agent {
    align-self: flex-start;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text);
  }
  .chat-msg.human {
    align-self: flex-end;
    background: #1a3a5c; border: 1px solid #2a5580;
    color: #d0e4ff;
  }
  .chat-msg .role {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin-bottom: 4px;
  }
  .chat-msg.agent .role { color: var(--accent); }
  .chat-msg.human .role { color: #6aa9ff; }
  .chat-msg .opts {
    margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  .chat-msg .opts button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 12px;
    cursor: pointer;
  }
  .chat-msg .opts button:hover { border-color: var(--accent); }
  #chatInput {
    display: flex; gap: 8px; padding: 10px 16px 14px;
    border-top: 1px solid var(--line);
  }
  #chatInput input {
    flex: 1; padding: 10px 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 13px;
  }
  #chatInput input:focus { outline: none; border-color: var(--accent); }
  #chatInput button {
    padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #0b1020; font-weight: 600; font-size: 13px;
  }
  #chatInput button:disabled { opacity: .4; cursor: not-allowed; }

  #browserSection { display: none; margin: 0 22px 40px; }
  #browserVideo {
    width: 100%; max-width: 880px; border-radius: 10px; background: #000;
    display: block; border: 1px solid var(--line);
  }
  .shots { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
  .shot { width: 186px; }
  .shot img {
    width: 100%; border-radius: 8px; border: 1px solid var(--line);
    display: block; background: #000;
  }
  .shot .rt { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  #consoleLog {
    font-family: var(--mono); font-size: 11.5px; color: #d9a7a2;
    max-height: 190px; overflow: auto; padding-top: 8px; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <h1>Crucible <span>— watch the robot work</span></h1>
  <span class="badge" id="statusText">idle</span>
</header>

<form id="form">
  <input type="url" id="url" value="http://localhost:3100" spellcheck="false"
         placeholder="http://localhost:3100" />
  <button type="submit" id="go">Start scan</button>
</form>

<main>
  <section>
    <h2>Live activity <span class="badge" id="eventCount">0</span></h2>
    <div id="feed"></div>
  </section>

  <div style="display:grid; gap:18px; align-content:start;">
    <section>
      <h2>Result</h2>
      <div class="pad" id="result"><p class="empty">Nothing yet. Start a scan.</p></div>
    </section>
    <section>
      <h2>Findings <span class="badge" id="findingCount">0</span></h2>
      <div id="findings"><p class="pad empty">No findings yet.</p></div>
    </section>
  </div>
</main>

<section id="chatSection">
  <h2>Talk to the agent <span class="badge" id="chatBadge">0</span></h2>
  <div id="chatMessages"></div>
  <div id="chatInput">
    <input type="text" id="chatText" placeholder="Type a message to the agent…" disabled />
    <button id="chatSend" disabled>Send</button>
  </div>
</section>

<section id="browserSection">
  <h2>What the browser saw <span class="badge" id="browserLabel"></span></h2>
  <div class="pad">
    <video id="browserVideo" controls muted playsinline preload="metadata"></video>
    <div class="shots" id="shots"></div>
    <details id="interactionWrap" style="display:none">
      <summary>
        Controls pressed (<span id="interactionCount">0</span>)
        \u2014 <span id="interactionFails">0</span> failed
      </summary>
      <div id="interactionLog"></div>
    </details>
    <details id="consoleWrap" style="display:none">
      <summary>Browser errors (<span id="consoleCount">0</span>)</summary>
      <div id="consoleLog"></div>
    </details>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const feed = $("feed");
  const form = $("form");
  const go = $("go");
  const dot = $("statusDot");
  const statusText = $("statusText");
  let source = null;
  let started = 0;
  let currentStreamId = null;
  let pendingQuestionId = null;
  //: Message ids already on screen. Both the live event stream and the run's
  //: conversation snapshot describe the same turns, and without this the same
  //: bubble would be drawn twice.
  const renderedIds = new Set();

  // --- Chat helpers ---
  function addChatMsg(role, text, options, messageId) {
    if (messageId && renderedIds.has(messageId)) return;
    if (messageId) renderedIds.add(messageId);

    const div = document.createElement("div");
    div.className = `chat-msg ${role}`;
    div.innerHTML = `<div class="role">${role === "agent" ? "🤖 Agent" : "👤 You"}</div>${esc(text)}`;

    if (options && options.length && role === "agent") {
      const opts = document.createElement("div");
      opts.className = "opts";
      options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => sendAnswer(opt, messageId);
        opts.appendChild(btn);
      });
      div.appendChild(opts);
      pendingQuestionId = messageId;
    }

    $("chatMessages").appendChild(div);
    $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
    const count = $("chatMessages").children.length;
    $("chatBadge").textContent = count;
  }

  async function postChat(path, body) {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        line("err", `<span class="k-bad">Message not sent</span> ${esc(err.detail || res.status)}`);
        return false;
      }
      return true;
    } catch (e) {
      line("err", `<span class="k-bad">Message not sent</span> ${esc(e.message)}`);
      return false;
    }
  }

  /**
   * Send whatever the operator typed.
   *
   * A pending question gets answered; anything else is posted as a chat
   * message the agent can reply to. Previously a typed message with no
   * question outstanding was only drawn locally, so it looked like the agent
   * was ignoring the operator.
   */
  async function sendChat(text) {
    if (!currentStreamId) {
      line("err", `<span class="k-bad">No run</span> start a scan before chatting`);
      return;
    }
    const questionId = pendingQuestionId;
    pendingQuestionId = null;

    const ok = questionId
      ? await postChat(`/api/runs/${currentStreamId}/answer`, {
          message_id: questionId,
          text,
        })
      : await postChat(`/api/runs/${currentStreamId}/message`, { text });

    if (!ok) {
      if (questionId) pendingQuestionId = questionId;
      return;
    }
    if (questionId) {
      document.querySelectorAll(".chat-msg .opts button").forEach((b) => (b.disabled = true));
    }
    // The server owns the conversation; redraw from it so both the operator's
    // message and the agent's reply come from one source of truth.
    refresh(currentStreamId);
  }

  /** Draw the server's conversation, skipping turns already on screen. */
  function renderConversation(conversation) {
    if (!Array.isArray(conversation)) return;
    const answered = new Set(
      conversation.filter((m) => m.in_reply_to).map((m) => m.in_reply_to)
    );
    let lastPending = null;
    conversation.forEach((msg) => {
      if (msg.role === "agent" && msg.requires_answer && !answered.has(msg.id)) {
        lastPending = msg.id;
      }
      addChatMsg(msg.role, msg.text, msg.options || null, msg.id);
    });
    pendingQuestionId = lastPending;
  }

  const stamp = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    return `+${String(s).padStart(3, "0")}s`;
  };

  function line(cls, html) {
    const row = document.createElement("div");
    row.className = "row" + (cls === "err" ? " err" : "");
    row.innerHTML = `<span class="t">${stamp()}</span><span class="m">${html}</span>`;
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  const esc = (v) => String(v ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

  /** Turn one raw event into a sentence a human wants to read. */
  function narrate(e) {
    const p = e;
    switch (e.type) {
      case "run.started":
        return line("", `<span class="k-stage">Run started</span> against ${esc(p.base_url)}`);
      case "recon.started":
        return line("", `<span class="k-stage">Recon</span> — exploring the site`);
      case "recon.page_visited": {
        const bad = p.status >= 400;
        return line("", `<span class="k-page">page</span> ${esc(p.path)} ${bad
          ? `<span class="k-bad">→ ${esc(p.status)} broken</span>`
          : `<span class="k-good">→ ${esc(p.status)}</span>`}${p.title ? ` <span class="k-mute">(${esc(p.title)})</span>` : ""}`);
      }
      case "recon.finished":
        return line("", `<span class="k-stage">Recon done</span> — ${p.routes} routes, ${p.forms} forms, ${p.failed} broken`);
      case "plan.started":
        return line("", `<span class="k-stage">Planning</span> — choosing what to test`);
      case "plan.case_added":
        return line("", `<span class="k-mute">plan</span> <span class="k-check">${esc(p.check_id)}</span> <span class="k-mute">risk ${esc(p.risk)}</span>`);
      case "exec.started":
        return line("", `<span class="k-stage">Executing</span> ${p.cases} checks`);
      case "exec.case_started":
        return line("", `<span class="k-mute">run</span> <span class="k-check">${esc(p.check_id)}</span>`);
      case "exec.case_finished": {
        const bad = p.had_error;
        return line(bad ? "err" : "", `<span class="k-mute">done</span> <span class="k-check">${esc(p.check_id)}</span> <span class="k-mute">${Math.round(p.duration_ms)}ms</span>${bad ? ' <span class="k-bad">errored</span>' : ""}`);
      }
      case "exec.finished":
        return line("", `<span class="k-stage">Executed</span> ${p.executed} checks`);
      case "browser.started":
        return line("", `<span class="k-stage">Browser</span> — opening a real browser to watch ${p.routes} pages`);
      case "browser.page_visited":
        return line("", `<span class="k-page">browser</span> ${esc(p.route)} ${p.status >= 400
          ? `<span class="k-bad">\u2192 ${esc(p.status)}</span>`
          : `<span class="k-good">\u2192 ${esc(p.status)}</span>`} <span class="k-mute">recorded</span>`);
      case "browser.finished":
        return line("", `<span class="k-stage">Browser done</span> — ${p.pages} pages, ${p.console_errors} browser error(s)${p.video_key ? ", video saved" : ""}`);
      case "browser.unavailable":
        return line("err", `<span class="k-bad">No browser</span> ${esc(p.reason)}`);
      case "triage.finding":
        return line("", `<span class="k-bad">finding</span> ${esc(p.title ?? p.bug_id ?? "")}`);
      case "oracle.verdict":
        return line("", `<span class="k-stage">Verdict</span> <b>${esc(p.decision)}</b> <span class="k-mute">confidence ${esc(p.confidence)}</span>`);
      case "run.finished":
        return line("", `<span class="k-stage">Finished</span> — ${p.findings} finding(s)`);
      case "run.failed":
        return line("err", `<span class="k-bad">Run failed</span> ${esc(p.error)}`);
      case "question.asked":
        addChatMsg("agent", p.text, p.options, p.message_id);
        return line("", `<span class="k-check">question</span> ${esc(p.text)}`);
      case "question.answered":
        return line("", `<span class="k-good">answer</span> ${esc(p.text)}`);
      case "human.message":
        return line("", `<span class="k-mute">you</span> ${esc(p.text)}`);
      case "interact.started":
        return line("", `<span class="k-stage">Interacting</span> — exercising every control on ${p.routes} page(s)`);
      case "interact.element_finished":
        return line(p.ok ? "" : "err", `<span class="k-mute">${esc(p.kind)}</span> <span class="k-check">${esc(p.label || p.selector)}</span> ${p.ok
          ? `<span class="k-good">\u2192 ok</span>`
          : `<span class="k-bad">\u2192 ${esc(p.status)}</span>`}`);
      case "interact.finished":
        return line("", `<span class="k-stage">Interaction done</span> — ${p.elements} control(s), ${p.failures} failed`);
      case "interact.unavailable":
        return line("err", `<span class="k-bad">No interaction lane</span> ${esc(p.reason)}`);
      case "stream.end":
        return null;
      default:
        return line("", `<span class="k-mute">${esc(e.type)}</span>`);
    }
  }

  async function refresh(streamId) {
    const res = await fetch(`/api/runs/${streamId}`);
    if (!res.ok) return;
    const d = await res.json();

    if (d.status === "running") {
      dot.className = "dot live"; statusText.textContent = "running";
    } else if (d.status === "succeeded") {
      dot.className = "dot done"; statusText.textContent = "finished";
    } else {
      dot.className = "dot fail"; statusText.textContent = "failed";
    }

    if (d.decision) {
      const b = d.benchmark;
      $("result").innerHTML = `
        <dl class="kv">
          <dt>Verdict</dt><dd style="color:${{BUG:"var(--bad)",NOT_A_BUG:"var(--ok)"}[d.decision] || "var(--warn)"}">${esc(d.decision)}</dd>
          <dt>Routes crawled</dt><dd>${d.routes}</dd>
          <dt>Checks run</dt><dd>${d.executions}</dd>
          <dt>Findings</dt><dd>${d.findings}</dd>
        </dl>
        ${b ? `<details open><summary>Accuracy against known defects</summary>
          <div class="pad" style="padding:10px 0 0">
            <dl class="kv">
              <dt>Recall</dt><dd class="score">${Math.round(b.recall * 100)}%</dd>
              <dt>Precision</dt><dd class="score">${Math.round(b.precision * 100)}%</dd>
              <dt>Found</dt><dd>${b.found} of ${b.declared_active}</dd>
              <dt>Missed</dt><dd>${b.missed.length ? esc(b.missed.join(", ")) : "—"}</dd>
            </dl>
          </div></details>` : ""}
        ${d.citations?.length ? `<details><summary>Evidence (${d.citations.length})</summary>
          ${d.citations.map((c) => `<div class="cite"><div class="sig">${esc(c.signal)} · ${esc(c.check_id)}${c.bug_id ? " · " + esc(c.bug_id) : ""}</div><div class="det">${esc(c.detail)}</div></div>`).join("")}
        </details>` : ""}
      `;
    }

    renderConversation(d.conversation);

    if (d.browser || d.interaction) {
      const b = d.browser || {};
      const it = d.interaction;
      $("browserSection").style.display = "";
      // The interaction pass drives every page and every control, so its
      // recording already contains the walk. Prefer it, and say so, so the
      // longer video is not mistaken for the short page-by-page one.
      const fullKey = d.full_video_key;
      const isFull = Boolean(it && it.video_key && fullKey === it.video_key);
      $("browserLabel").textContent =
        (b.browser || "browser") + (isFull ? " \u00b7 full run" : " \u00b7 pages only");
      if (fullKey) {
        const video = $("browserVideo");
        // Only reassign when it changed, or the video restarts on every poll.
        if (!video.src.endsWith(fullKey)) video.src = `/api/artifacts/${fullKey}`;
      }

      $("interactionCount").textContent = it ? it.elements : 0;
      $("interactionFails").textContent = it ? it.failures : 0;
      $("interactionWrap").style.display = it && it.elements ? "" : "none";
      $("interactionLog").innerHTML = it
        ? (it.results || [])
            .filter((r) => !r.ok)
            .map((r) =>
              `<div>[${esc(r.failure)}] ${esc(r.kind)} ${esc(r.label)} on ${esc(r.route)} \u2014 ${esc(r.detail)}</div>`)
            .join("")
        : "";
      $("shots").innerHTML = (b.screenshots || []).map((s) => `
        <div class="shot">
          <a href="/api/artifacts/${s.key}" target="_blank" rel="noopener">
            <img src="/api/artifacts/${s.key}" alt="${esc(s.route)}">
          </a>
          <div class="rt">${esc(s.route)}${s.status ? " \u00b7 " + esc(s.status) : ""}</div>
        </div>`).join("");

      const errs = b.console_errors || [];
      $("consoleCount").textContent = errs.length;
      $("consoleWrap").style.display = errs.length ? "" : "none";
      $("consoleLog").innerHTML = errs.map((e) =>
        `<div>[${esc(e.kind)}] ${esc(e.route)} \u2014 ${esc(e.text)}</div>`).join("");
    }

    if (d.finding_details?.length) {
      $("findingCount").textContent = d.finding_details.length;
      $("findings").innerHTML = d.finding_details.map((f) => `
        <div class="finding">
          <div class="title">${esc(f.title)}</div>
          <div class="meta"><span class="badge ${esc(f.severity)}">${esc(f.severity)}</span>${f.bug_id ? " " + esc(f.bug_id) : ""}</div>
          ${f.observed ? `<div class="blk"><span class="lbl">What it saw</span>${esc(f.observed)}</div>` : ""}
          ${f.cause ? `<div class="blk"><span class="lbl">Why it happens</span>${esc(f.cause)}</div>` : ""}
          ${f.suggested_fix ? `<div class="blk fix"><span class="lbl">How to fix it</span>${esc(f.suggested_fix)}</div>` : ""}
        </div>`).join("");
    }
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const url = $("url").value.trim();
    if (!url) return;

    if (source) { source.close(); source = null; }
    feed.innerHTML = "";
    $("result").innerHTML = '<p class="empty">Running…</p>';
    $("findings").innerHTML = '<p class="pad empty">No findings yet.</p>';
    $("findingCount").textContent = "0";
    $("browserSection").style.display = "none";
    $("browserVideo").removeAttribute("src");
    $("shots").innerHTML = "";
    $("consoleLog").innerHTML = "";
    $("chatMessages").innerHTML = "";
    $("chatBadge").textContent = "0";
    renderedIds.clear();
    pendingQuestionId = null;
    go.disabled = true;
    started = Date.now();
    dot.className = "dot live"; statusText.textContent = "starting";

    let streamId;
    try {
      const res = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        line("err", `<span class="k-bad">Could not start</span> ${esc(err.detail || res.status)}`);
        go.disabled = false; dot.className = "dot fail"; statusText.textContent = "error";
        return;
      }
      ({ stream_id: streamId } = await res.json());
      currentStreamId = streamId;
    } catch (e) {
      line("err", `<span class="k-bad">Could not start</span> ${esc(e.message)}`);
      go.disabled = false; dot.className = "dot fail"; statusText.textContent = "error";
      return;
    }

    // Enable the chat input once a run is active.
    $("chatText").disabled = false;
    $("chatSend").disabled = false;
    addChatMsg("agent", "Scan started — I'll tell you what I find and ask when I'm stuck.", null, null);

    let count = 0;
    source = new EventSource(`/api/runs/${streamId}/events`);
    source.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === "stream.end") {
        source.close(); source = null;
        go.disabled = false;
        return;
      }
      count += 1;
      $("eventCount").textContent = count;
      narrate(data);
      refresh(streamId);
    };
    source.onerror = () => {
      if (source) { source.close(); source = null; }
      go.disabled = false;
      $("chatText").disabled = true;
      $("chatSend").disabled = true;
      refresh(streamId);
    };
  });

  // Chat send button and enter key.
  $("chatSend").onclick = () => {
    const text = $("chatText").value.trim();
    if (!text) return;
    $("chatText").value = "";
    sendChat(text);
  };
  $("chatText").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") $("chatSend").click();
  });
})();
</script>
</body>
</html>
